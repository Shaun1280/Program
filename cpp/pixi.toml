[workspace]
name = "cpp"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# C/C++ toolchain (gcc from conda-forge; pixi.lock pins the exact version)
cxx-compiler = "*"
cmake = ">=3.30"
ninja = "*"
# C++ dependencies (replaces Conan)
gtest = ">=1.17"
# Editor tooling for VSCode (clangd)
clang-tools = "*"

[tasks]
build-debug = "bash devtools/build.sh debug"
build-release = "bash devtools/build.sh release"
test-debug = "ctest --preset debug"
test-release = "ctest --preset release"
clean = "bash devtools/clean.sh"
